<body>
<div id="splash"><div class="bv-f"></div><div class="bv-foto"></div><div class="bv-g"></div>
  <div class="bv-t"><div class="bv-n">Gambipool</div><div class="bv-c">Real Guadalhorce Club de Golf</div></div></div>
<script>
/* La bienvenida cuenta su tiempo desde que la foto está pintada (no desde que se abre la app) */
(function () {
  // El día de la jornada (o con golpes pendientes) no hay bienvenida: directo a la app
  var saltar = false;
  try {
    if (JSON.parse(localStorage.getItem("gp_cola_golpes") || "[]").length) saltar = true;
    var hoy = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Madrid" }).format(new Date());
    (JSON.parse(localStorage.getItem("gp_c1_jornadas") || "[]") || []).forEach(function (j) {
      if (j && !j.cerrada && j.estado !== "suspendida" && j.fecha <= hoy && (j.fecha_fin || j.fecha) >= hoy) saltar = true;
    });
  } catch (e) { /* sin almacenamiento: bienvenida normal */ }
  if (saltar) { var sp = document.getElementById("splash"); if (sp) sp.remove(); window.__bv = Promise.resolve(false); return; }
  window.__bv = new Promise(function (ok) {
    var img = new Image(), hecho = false;
    function fin(v) { if (!hecho) { hecho = true; ok(v); } }
    img.onload = function () {
      (img.decode ? img.decode() : Promise.resolve()).catch(function () {}).then(function () {
        requestAnimationFrame(function () { requestAnimationFrame(function () { fin(true); }); });
      });
    };
    img.onerror = function () { fin(false); };
    img.src = "casaclub.jpg";
    setTimeout(function () { fin(false); }, 3000);   // sin foto: no bloquea la app
  });
})();
</script>
<div id="root"></div>

</body>
