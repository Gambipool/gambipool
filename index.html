<script>
/* La bienvenida cuenta su tiempo desde que la foto está pintada (no desde que se abre la app) */
(function () {
  window.__bv = new Promise(function (ok) {
    var img = new Image(), hecho = false;
    function fin(v) { if (!hecho) { hecho = true; ok(v); } }
    img.onload = function () {
      (img.decode ? img.decode() : Promise.resolve()).catch(function () {}).then(function () {
        requestAnimationFrame(function () { requestAnimationFrame(function () { fin(true); }); });
      });
    };
    img.onerror = function () { fin(false); };
    img.src = "casaclub.jpg";
    setTimeout(function () { fin(false); }, 3000);   // sin foto: no bloquea la app
  });
})();
</script>
<div id="root"></div>
<script>
/* iOS 26: un scroll de 1 px hace que la app instalada recalcule el alto real de la pantalla (sin franja abajo) */
window.__empujon = function () { var y = window.scrollY; window.scrollTo(0, y + 1); requestAnimationFrame(function () { window.scrollTo(0, y); }); };
window.__empujon();
document.addEventListener("visibilitychange", function () { if (!document.hidden) setTimeout(window.__empujon, 50); });
</script>
